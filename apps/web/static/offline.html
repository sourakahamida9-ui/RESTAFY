<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ea580c" />
  <title>Hors ligne — Restafy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #08080a;
      color: #f4f4f5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(234, 88, 12, 0.15);
      color: #fdba74;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; font-weight: 700; }
    p { color: #a1a1aa; margin: 0 0 24px; line-height: 1.5; font-size: 15px; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: #ea580c;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #c2410c; }
    .small {
      margin-top: 20px;
      font-size: 13px;
      color: #71717a;
    }
    .small a { color: #fdba74; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Hors ligne</span>
    <h1>Aucune connexion</h1>
    <p>Restafy n'arrive pas à joindre le serveur. Vérifiez votre Wi-Fi ou vos données mobiles, puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
    <p class="small">Si le problème persiste : <a href="https://wa.me/2290193527256">contacter le support</a></p>
  </div>
  <script>
    // Auto-retry quand la connexion revient
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
